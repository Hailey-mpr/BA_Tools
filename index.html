<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BA Model Recommender</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #1e3a5f;
      --accent:    #2e86de;
      --accent2:   #f9a825;
      --bg:        #f4f6fa;
      --card-bg:   #ffffff;
      --text:      #1a1a2e;
      --muted:     #6b7280;
      --border:    #e2e8f0;
      --tag-bg:    #e8f0fe;
      --tag-text:  #1a56db;
      --green:     #059669;
      --radius:    12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #2c5282 100%);
      color: #fff;
      padding: 36px 24px 32px;
      text-align: center;
    }
    header .logo { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
    header .logo span { color: var(--accent2); }
    header p {
      margin-top: 8px;
      font-size: 1rem;
      color: #b0c4e8;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Search bar ── */
    .search-wrap {
      background: var(--primary);
      padding: 0 24px 28px;
    }
    .search-box {
      display: flex;
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 50px;
      box-shadow: 0 4px 24px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 16px 22px;
      font-size: 1rem;
      color: var(--text);
      background: transparent;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 0 28px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background .2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: #1a6fc4; }

    /* ── Quick-pick chips ── */
    .quick-picks {
      max-width: 680px;
      margin: 14px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-picks span { font-size: .78rem; color: #9ab4d8; margin-right: 4px; }
    .chip {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #d4e4f7;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .8rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .chip:hover, .chip:active { background: var(--accent2); color: #1a1a2e; border-color: var(--accent2); }

    /* ── Main layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Section headers ── */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 16px;
    }
    .result-count {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 20px;
      padding: 1px 10px;
      font-size: .75rem;
      margin-left: 8px;
      vertical-align: middle;
      font-weight: 700;
    }

    /* ── Cards grid ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .card:hover, .card:focus-within {
      box-shadow: 0 8px 32px rgba(30,58,95,.12);
      transform: translateY(-2px);
    }

    /* relevance badge */
    .badge-wrap { position: absolute; top: 16px; right: 16px; }
    .badge {
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .badge.top    { background: #fef3c7; color: #92400e; }
    .badge.good   { background: #d1fae5; color: #065f46; }
    .badge.normal { background: var(--tag-bg); color: var(--tag-text); }

    .card-category {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      padding-right: 60px;
    }
    .card-desc {
      font-size: .88rem;
      color: #4a5568;
      line-height: 1.55;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: .72rem;
      font-weight: 600;
    }
    .tag.highlight {
      background: #fef3c7;
      color: #92400e;
    }

    /* when-to-use section inside card */
    .when {
      margin-top: 12px;
      background: #f8fafc;
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 8px 12px;
      font-size: .82rem;
      color: #374151;
      line-height: 1.5;
    }
    .when strong { color: var(--primary); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }

    /* ── Category filter pills ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .filter-pill {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 20px;
      padding: 5px 16px;
      font-size: .82rem;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      font-weight: 500;
      color: var(--muted);
    }
    .filter-pill.active, .filter-pill:hover, .filter-pill:active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: .82rem;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive: tablet (≤768px) ── */
    @media (max-width: 768px) {
      .cards {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }
      main {
        padding: 24px 16px 48px;
      }
    }

    /* ── Responsive: mobile (≤540px) ── */
    @media (max-width: 540px) {
      /* Header */
      header {
        padding: 28px 16px 24px;
      }
      header .logo {
        font-size: 1.4rem;
      }
      header p {
        font-size: .88rem;
      }

      /* Search */
      .search-wrap {
        padding: 0 16px 20px;
      }
      .search-box {
        flex-direction: column;
        border-radius: 16px;
        overflow: hidden;
      }
      .search-box input {
        padding: 14px 18px;
        font-size: .95rem;
        border-bottom: 1px solid var(--border);
      }
      .search-box button {
        padding: 13px 18px;
        font-size: .9rem;
        width: 100%;
        text-align: center;
      }

      /* Quick-pick chips */
      .quick-picks {
        margin-top: 12px;
        gap: 6px;
      }
      .chip {
        font-size: .75rem;
        padding: 4px 12px;
      }

      /* Filter pills — horizontal scroll instead of wrap */
      .filters {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 4px;
        gap: 6px;
        margin-bottom: 18px;
      }
      .filters::-webkit-scrollbar { display: none; }
      .filter-pill {
        flex-shrink: 0;
        font-size: .78rem;
        padding: 5px 14px;
        white-space: nowrap;
      }

      /* Cards */
      .cards {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .card {
        padding: 18px 16px 14px;
      }
      .card-title {
        font-size: .98rem;
        padding-right: 72px;
      }
      .card-desc {
        font-size: .84rem;
      }
      .when {
        font-size: .8rem;
      }

      /* Badge – avoid overlap on narrow cards */
      .badge-wrap {
        top: 14px;
        right: 14px;
      }
      .badge {
        font-size: .68rem;
        padding: 2px 8px;
      }

      /* Section title */
      .section-title {
        font-size: .88rem;
      }

      /* Main */
      main {
        padding: 20px 12px 40px;
      }

      /* Footer */
      footer {
        font-size: .78rem;
        padding: 16px 12px;
      }
    }
  </style>
</head>

// ──────────────────────────────────────────────
//  CATEGORIES & CHIPS
// ──────────────────────────────────────────────
const QUICK_CHIPS = [
  "manage stakeholders", "prioritise requirements", "map a process",
  "root cause analysis", "make a decision", "manage change",
  "improve customer experience", "analyse strategy", "design a database"
];

const ALL_CATEGORIES = [...new Set(BA_MODELS.map(m => m.category))].sort();

// ──────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────
let currentQuery   = "";
let activeCategory = "All";

// ──────────────────────────────────────────────
//  SCORING: how relevant is a model to the query?
// ──────────────────────────────────────────────
function score(model, query) {
  if (!query) return 1;
  const q = query.toLowerCase();
  const tokens = q.split(/\s+/).filter(t => t.length > 2);
  let pts = 0;

  // exact keyword match
  for (const kw of model.keywords) {
    if (q.includes(kw)) pts += kw.split(" ").length * 4; // longer phrase = higher weight
  }
  // partial token match
  for (const token of tokens) {
    for (const kw of model.keywords) {
      if (kw.includes(token)) pts += 1;
    }
    if (model.name.toLowerCase().includes(token))          pts += 3;
    if (model.category.toLowerCase().includes(token))      pts += 2;
    if (model.description.toLowerCase().includes(token))   pts += 1;
    for (const tag of model.tags) {
      if (tag.toLowerCase().includes(token)) pts += 2;
    }
  }
  return pts;
}

// ──────────────────────────────────────────────
//  RENDER
// ──────────────────────────────────────────────
function badgeLabel(rank, total) {
  if (!currentQuery) return null;
  if (rank === 0) return { cls: "top",    text: "⭐ Best Match" };
  if (rank <= Math.min(2, total - 1)) return { cls: "good",   text: "Strong Match" };
  return null;
}

function highlightTags(tags, query) {
  if (!query) return tags.map(t => `<span class="tag">${t}</span>`).join("");
  const tokens = query.toLowerCase().split(/\s+/);
  return tags.map(t => {
    const hi = tokens.some(tok => t.toLowerCase().includes(tok));
    return `<span class="tag${hi ? " highlight" : ""}">${t}</span>`;
  }).join("");
}

function renderCards(models, ranked) {
  const container = document.getElementById("cardsContainer");
  if (!models.length) {
    container.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <h3>No models matched your search</h3>
        <p>Try different words — e.g. "stakeholders", "process", "decision", "risk"</p>
      </div>`;
    return;
  }

  container.innerHTML = models.map((m, idx) => {
    const b = ranked ? badgeLabel(idx, models.length) : null;
    const badgeHtml = b ? `<div class="badge-wrap"><span class="badge ${b.cls}">${b.text}</span></div>` : "";
    return `
    <div class="card" data-id="${m.id}">
      ${badgeHtml}
      <div class="card-category">${m.category}</div>
      <div class="card-title">${m.name}</div>
      <div class="card-desc">${m.description}</div>
      <div class="when"><strong>When to use:</strong> ${m.when}</div>
      <div class="card-tags">${highlightTags(m.tags, currentQuery)}</div>
    </div>`;
  }).join("");
}

// ──────────────────────────────────────────────
//  SEARCH
// ──────────────────────────────────────────────
function runSearch(queryOverride) {
  currentQuery = (queryOverride !== undefined ? queryOverride : document.getElementById("searchInput").value).trim();

  if (queryOverride !== undefined) {
    document.getElementById("searchInput").value = currentQuery;
  }

  activeCategory = "All";
  renderFilters();
  applyFilters();
}

function applyFilters() {
  let models = [...BA_MODELS];

  // category filter
  if (activeCategory !== "All") {
    models = models.filter(m => m.category === activeCategory);
  }

  // score + sort
  if (currentQuery) {
    models = models
      .map(m => ({ ...m, _score: score(m, currentQuery) }))
      .filter(m => m._score > 0)
      .sort((a, b) => b._score - a._score);
  }

  const title   = document.getElementById("sectionTitle");
  const badge   = document.getElementById("countBadge");
  badge.textContent = models.length;

  if (currentQuery && activeCategory === "All") {
    title.innerHTML = `Results for "<em>${currentQuery}</em>" <span class="result-count" id="countBadge">${models.length}</span>`;
  } else if (activeCategory !== "All") {
    title.innerHTML = `${activeCategory} <span class="result-count" id="countBadge">${models.length}</span>`;
  } else {
    title.innerHTML = `All Models <span class="result-count" id="countBadge">${models.length}</span>`;
  }

  renderCards(models, !!currentQuery);
}

// ──────────────────────────────────────────────
//  FILTERS
// ──────────────────────────────────────────────
function renderFilters() {
  const wrap = document.getElementById("filters");
  const cats = ["All", ...ALL_CATEGORIES];
  wrap.innerHTML = cats.map(c => `
    <button class="filter-pill${activeCategory === c ? " active" : ""}" onclick="selectCategory('${c}')">${c}</button>
  `).join("");
}

function selectCategory(cat) {
  activeCategory = cat;
  renderFilters();
  applyFilters();
}

// ──────────────────────────────────────────────
//  QUICK CHIPS
// ──────────────────────────────────────────────
function renderChips() {
  const wrap = document.getElementById("quickPicks");
  wrap.innerHTML = `<span>Try:</span>` + QUICK_CHIPS.map(c =>
    `<span class="chip" onclick="runSearch('${c}')">${c}</span>`
  ).join("");
}

// ──────────────────────────────────────────────
//  KEYBOARD SUPPORT
// ──────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
renderChips();
renderFilters();
applyFilters();
</script>
